[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent"
version = "0.1.0"
description = "Browser-based English voice agent using Deepgram Flux and Pipecat"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.22,<1",
  "cryptography>=45,<51",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pipecat-ai[deepgram,google,openai,runner,websocket]==1.8.1",
  "pydantic>=2.11,<3",
  "soundfile>=0.13,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
follow_imports = "skip"
warn_unused_ignores = true
exclude = ["benchmarks", "scripts/vendor"]
