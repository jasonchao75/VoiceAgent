name: VoiceAgent CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify:
    name: Test and Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Required to run `git ls-files` properly for .env check
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev]'

      - name: Run repository safety checks
        env:
          PYTHONPYCACHEPREFIX: /tmp/python-pycache
        run: |
          chmod +x scripts/ci/run_checks.py
          ./scripts/ci/run_checks.py

      - name: Run backend checks
        run: |
          python -m ruff format --check src tests
          python -m ruff check src tests
          python -m mypy src
          python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build production image
        run: docker build --tag voiceagent-platform:ci .
