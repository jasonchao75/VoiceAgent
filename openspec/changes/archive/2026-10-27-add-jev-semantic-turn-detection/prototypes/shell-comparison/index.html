<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q-047 · 手机页面原型对比</title><style>
*{box-sizing:border-box}body{margin:0;background:#101412;color:#edf2ef;font:14px system-ui,sans-serif}header{padding:22px 24px;border-bottom:1px solid #303b34}h1{font-size:21px;margin:0 0 10px}p{color:#aebbb3;line-height:1.6;margin:8px 0}nav{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}button,a{font:inherit;color:#d9f7e6;background:#1a3024;border:1px solid #416b51;border-radius:7px;padding:8px 13px;cursor:pointer;text-decoration:none}main{display:flex;justify-content:center;align-items:flex-start;gap:32px;padding:24px;flex-wrap:wrap}section{width:390px;max-width:100%}h2{font-size:18px;margin:0 0 7px}.caption{min-height:46px}iframe{display:block;width:390px;max-width:100%;height:780px;border:1px solid #45544a;border-radius:14px;background:#0d100f}.note{font-size:12px}
</style></head><body><header><h1>手机页面：A / B 实际原型</h1><p>两边都可以点击、切换页面、向下滚动。区别只有「机器人列表」在页面上方还是下方。</p><nav><button data-page="share">查看 Share 页面</button><button data-page="advanced">查看 Advanced 页面</button><button data-page="settings">查看 Bot settings 页面</button><a href="../index.html" target="_blank">打开冻结原型完整页面 ↗</a></nav><p class="note">此页用于 Q-047 方案选择；未修改冻结原型，也未改变正式页面。</p></header><main><section><h2>A · 机器人列表在上方</h2><p class="caption">遵循冻结原型。先选机器人，再看当前页面。</p><iframe title="A 冻结原型：列表在上方" src="../index.html" data-option="a"></iframe></section><section><h2>B · 机器人列表在下方</h2><p class="caption">保留正式页面现有顺序。先看当前页面，向下滚动后选机器人。</p><iframe title="B 对比原型：列表在下方" src="../index.html" data-option="b"></iframe></section></main><script>
const frames=[...document.querySelectorAll('iframe')];
function show(frame,page){frame.contentDocument.querySelector(`[data-page="${page}"]`)?.click();frame.contentWindow.scrollTo(0,0)}
for(const frame of frames)frame.addEventListener('load',()=>{if(frame.dataset.option==='b'){const doc=frame.contentDocument;doc.querySelector('main.shell').append(doc.querySelector('.config-panel'));}show(frame,'share')});
for(const button of document.querySelectorAll('button[data-page]'))button.addEventListener('click',()=>frames.forEach(frame=>show(frame,button.dataset.page)));
</script></body></html>
